# Core resource table (PRD R2).
#
# Hardcoded GVK + aliases for the resource types kubectl users expect to
# resolve instantly, without a per-context discovery round-trip. This table
# wins ties against the discovery cache (resolution/discovery.py) but is not
# the sole source of truth — CRDs and any resource absent here fall through
# to per-context `kubectl api-resources` discovery (R2, R5).
#
# `verbs` lists which of the fixed MCP tool-verbs (get, logs, apply, patch,
# delete, exec) are structurally supported by this resource type — used by
# R8's pre-execution validation to fail fast with `verb_unsupported` instead
# of surfacing a raw kubectl error. `logs` and `exec` apply only to pods.

[[resource]]
canonical = "pods"
shortnames = ["po"]
kind = "Pod"
group = ""
version = "v1"
namespaced = true
verbs = ["get", "logs", "apply", "patch", "delete", "exec"]

