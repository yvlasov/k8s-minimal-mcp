[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k8s-minimal-mcp"
version = "0.1.0"
description = "Minimal verb-based Kubernetes MCP server"
readme = "PRD.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Iurii Vlasov" }]
dependencies = [
    "fastmcp>=4.0,<5",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "mypy>=1.10",
    "ruff>=0.6",
]

[project.scripts]
k8s-mcp = "k8s_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
disable_error_code = []

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260906",
]
